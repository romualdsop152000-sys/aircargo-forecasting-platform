name: Scheduled Flight Ingestion

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  ingest-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up API
        run: |
          echo "Waking up API..."
          curl -s https://aircargo-forecasting-platform.onrender.com/ || true
          sleep 20

      - name: Check secrets presence
        run: |
          if [ -z "${{ secrets.API_USERNAME }}" ]; then
            echo "API_USERNAME is empty or missing"
            exit 1
          fi

          if [ -z "${{ secrets.API_PASSWORD }}" ]; then
            echo "API_PASSWORD is empty or missing"
            exit 1
          fi

          echo "Secrets are present"

      - name: Login and get token
        id: login
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://aircargo-forecasting-platform.onrender.com/login" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "username=${{ secrets.API_USERNAME }}" \
            --data-urlencode "password=${{ secrets.API_PASSWORD }}" \
            --data-urlencode "grant_type=password")

          BODY=$(echo "$RESPONSE" | sed -n '/HTTP_STATUS:/!p')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d ":" -f2)

          echo "Login HTTP status: $STATUS"
          echo "Login response body:"
          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "Login failed"
            exit 1
          fi

          TOKEN=$(echo "$BODY" | python -c "
import sys, json
data = json.load(sys.stdin)
if 'access_token' not in data:
    raise Exception(f'No access_token found in login response: {data}')
print(data['access_token'])
")

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger OpenSky flight ingestion
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://aircargo-forecasting-platform.onrender.com/ingest/flights?limit=10" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}" \
            -H "accept: application/json")

          BODY=$(echo "$RESPONSE" | sed -n '/HTTP_STATUS:/!p')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d ":" -f2)

          echo "Ingestion HTTP status: $STATUS"
          echo "Ingestion response body:"
          echo "$BODY"

          if [ "$STATUS" != "200" ]; then
            echo "Ingestion failed"
            exit 1
          fi