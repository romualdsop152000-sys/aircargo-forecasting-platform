name: Scheduled Flight Ingestion

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ingest-flights:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up API
        run: |
          curl -s https://aircargo-forecasting-platform.onrender.com/ || true
          sleep 20

      - name: Login and get token
        id: login
        run: |
          RESPONSE=$(curl -s -X POST "https://aircargo-forecasting-platform.onrender.com/login" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=${{ secrets.API_USERNAME }}&password=${{ secrets.API_PASSWORD }}&grant_type=password")

          echo "Login response:"
          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | python -c "
import sys, json
data = json.load(sys.stdin)
if 'access_token' not in data:
    raise Exception(f'No access_token found in response: {data}')
print(data['access_token'])
")

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Trigger OpenSky flight ingestion
        run: |
          curl -X POST "https://aircargo-forecasting-platform.onrender.com/ingest/flights?limit=10" \
            -H "Authorization: Bearer ${{ steps.login.outputs.token }}" \
            -H "accept: application/json"